name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build knowledge base
        run: node scripts/build-kb.mjs
      - name: Stage static site
        run: |
          mkdir -p dist
          cp -r index.html assets .nojekyll dist/
      - name: Inject temporary runtime config
        env:
          RUNTIME_CONFIG_JS: ${{ secrets.RUNTIME_CONFIG_JS }}
        run: |
          if [ -n "$RUNTIME_CONFIG_JS" ]; then
            printf '%s' "$RUNTIME_CONFIG_JS" > dist/assets/config.js
            echo "Injected runtime config from repository secret."
          else
            echo "No RUNTIME_CONFIG_JS secret; using offline defaults."
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
